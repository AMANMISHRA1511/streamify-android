name: Build Streamify APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.STREAMIFY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > app/streamify-release.jks

      - name: Build signed release APK
        env:
          STREAMIFY_KEYSTORE_PATH: streamify-release.jks
          STREAMIFY_KEYSTORE_PASSWORD: ${{ secrets.STREAMIFY_KEYSTORE_PASSWORD }}
          STREAMIFY_KEY_PASSWORD: ${{ secrets.STREAMIFY_KEY_PASSWORD }}
          STREAMIFY_KEY_ALIAS: ${{ secrets.STREAMIFY_KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
